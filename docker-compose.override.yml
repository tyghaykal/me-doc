# Auto-loaded by `docker compose up` alongside docker-compose.yml.
# Swaps backend/frontend to dev images with hot reload via bind mounts.
# For a prod-like build, run: docker compose -f docker-compose.yml up

services:
  # postgres/redis/minio-console/backend have no host ports in the base
  # docker-compose.yml (production shouldn't expose a database, cache, admin
  # console, or the API's non-TLS/non-rate-limited direct port to the host).
  # This override restores them for local dev convenience only — a GUI DB
  # client, `redis-cli`, the MinIO console, and `curl localhost:8080/health`.
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  minio:
    ports:
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    command: cargo watch -x run

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Playwright is a host-side devDependency; the container must not pull ~150MB
      # of browsers when it installs from the lockfile.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile || pnpm install; pnpm dev --host 0.0.0.0"

volumes:
  cargo-registry:
  cargo-target:
  frontend-node-modules:
