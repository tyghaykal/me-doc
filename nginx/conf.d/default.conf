map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    client_max_body_size 20m;

    # `always` so these still apply on error responses (4xx/5xx), not just 2xx.
    # img-src stays permissive (https:/http:) because the object-storage host
    # (S3_PUBLIC_ENDPOINT) is operator-configured and can be a different origin
    # per deployment — this static config has no templating to inject it.
    # script-src keeps 'unsafe-inline' for the theme-flash-prevention snippet
    # in nuxt.config.ts; tightening that to a script hash/nonce is a follow-up,
    # not a regression from removing it here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Backend API + collab websocket. Prefixes match backend/src/main.rs's
    # router exactly (health, auth, workspaces, pages, permissions,
    # attachments, me, ws, comments) — everything else falls through to the frontend below.
    # Upstream ports are the *container* listen ports (always 8080 / 3000),
    # not the host-published ports from .env (BACKEND_HOST_PORT / FRONTEND_HOST_PORT).
    # Inside the compose network those host ports do not exist on the service.
    location ~ ^/(health|auth|workspaces|pages|permissions|attachments|me|ws|comments)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Nuxt frontend (also carries its own Vite HMR websocket in dev).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
