name: me-doc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medoc}
      POSTGRES_DB: ${POSTGRES_DB:-medoc}
    # No host port here: only `backend` needs to reach postgres, over the
    # compose-internal network. Dev tooling (a GUI client, `psql` from the
    # host) gets the port back via docker-compose.override.yml.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medoc} -d ${POSTGRES_DB:-medoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port: same reasoning as postgres above.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    # Unlike postgres/redis, the S3 *API* port has to stay published even in
    # a prod-like build: uploads/downloads go browser<->MinIO directly via
    # presigned URLs (see backend/src/storage/mod.rs), not through the
    # backend. Only the admin *console* is dev-only — moved to the override.
    ports:
      - "${MINIO_API_HOST_PORT:-9010}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket setup — NOT started by `docker compose up`. Run it explicitly
  # (./scripts/init-minio.sh, or `docker compose run --rm minio-createbuckets`)
  # the first time you bring the stack up against a fresh minio-data volume;
  # `--rm` removes the container the moment it exits, so nothing lingers.
  minio-createbuckets:
    image: minio/mc:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-medoc}
    # No `mc anonymous set download`: the bucket is private. Reads go through
    # the backend's authenticated /attachments/download and /auth/avatars/download
    # endpoints, which check the caller's permission before handing back a
    # short-lived presigned GET — see backend/src/storage/mod.rs.
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET || true &&
      echo 'bucket ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1125}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8125}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MarkItDown-backed doc-to-Markdown conversion for page import (docx/pdf/
  # xlsx/epub/...). Internal-only — no published port, reached by the backend
  # over the compose network the same way it reaches postgres/redis/minio.
  converter:
    build:
      context: ./converter
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal addresses always use the service's own listen port
      # (postgres:5432, redis:6379, minio:9000, mailpit:1025, backend:8080).
      # *_HOST_PORT vars only remap the published host side of `ports:` —
      # never put those into REDIS_URL / S3_ENDPOINT / SMTP_PORT / BACKEND_PORT
      # or inter-container traffic (and nginx) will hit the wrong port.
      DATABASE_URL: postgres://${POSTGRES_USER:-medoc}:${POSTGRES_PASSWORD:-medoc}@postgres:5432/${POSTGRES_DB:-medoc}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_HOST_PORT:-9010}}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-medoc}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-no-reply@me-doc.local}
      CONVERTER_URL: http://converter:8000
      # Off by default — sends every exported diagram's source to the public
      # mermaid.ink service. Set to "true" only if that's acceptable for your
      # deployment's data-handling policy.
      EXPORT_DIAGRAM_RENDER_ENABLED: ${EXPORT_DIAGRAM_RENDER_ENABLED:-false}
      BACKEND_PORT: "8080"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-1209600}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      RUST_LOG: ${RUST_LOG:-info}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost}
    # No host port: all real traffic reaches the backend through nginx.
    # Publishing this directly would also let a client bypass nginx's
    # X-Forwarded-For and spoof the rate limiter's per-client key (see
    # SmartIpKeyExtractor in main.rs). Dev convenience (curl'ing :8080
    # directly) comes back via docker-compose.override.yml.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      converter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Browser calls go through nginx (single origin, path-based routing —
      # see nginx/conf.d/default.conf), so this must be the nginx origin, not
      # the container's own port. SSR fetches (NUXT_API_BASE_SERVER) bypass
      # nginx entirely and hit the backend container directly, unaffected.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://localhost}
      NUXT_API_BASE_SERVER: http://backend:8080
      # Browser-reachable MinIO base for avatar/attachment URLs (nuxt.config.ts
      # otherwise falls back to a hardcoded :9010, going stale whenever
      # MINIO_API_HOST_PORT changes in .env) — derived from the same
      # host-port var the backend's S3_PUBLIC_ENDPOINT already uses, so both
      # sides move together automatically.
      NUXT_PUBLIC_MINIO_BASE: ${NUXT_PUBLIC_MINIO_BASE:-http://localhost:${MINIO_API_HOST_PORT:-9010}/${S3_BUCKET:-medoc}}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      # Host port 80 is taken by an unrelated container on this machine
      # (personal-nginx) — the plain-HTTP listener only exists to redirect to
      # HTTPS, so it's fine to publish it on a non-standard host port instead.
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
